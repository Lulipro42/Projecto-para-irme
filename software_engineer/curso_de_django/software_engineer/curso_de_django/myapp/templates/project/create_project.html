{% extends "layouts/base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    
    <h2 style="color: #333; margin-bottom: 25px; border-bottom: 2px solid #007bff; padding-bottom: 10px; display: flex; align-items: center; gap: 10px;">
        📁 Crear Nuevo Proyecto
    </h2>

    <form method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom: 25px;">
            <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #495057;">
                Nombre del Proyecto:
            </label>
            <input type="text" name="name" required placeholder="Ej: Sistema de Gestión, Web App..." style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; box-sizing: border-box;">
        </div>

        <button type="submit" style="background: #28a745; color: white; border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: background 0.2s;">
            💾 Guardar Proyecto
        </button>
    </form>

    {% if error %}
        <div style="margin-top: 20px; padding: 10px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 6px; font-weight: bold; text-align: center;">
            ⚠️ {{ error }}
        </div>
    {% endif %}

    <br>
    <hr style="border: 0; border-top: 1px solid #e9ecef; margin: 20px 0;">
    
    <div style="text-align: center;">
        <a href="{% url 'projects' %}" style="color: #007bff; text-decoration: none; font-weight: 600; font-size: 0.95rem;">
            ⬅️ Volver a la lista de proyectos
        </a>
    </div>
</div>
{% endblock %}
