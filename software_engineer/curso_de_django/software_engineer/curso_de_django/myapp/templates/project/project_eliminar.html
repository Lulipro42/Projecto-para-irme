{% extends 'layouts/base.html' %} <!-- Ajustá la ruta si tu base está en otra carpeta -->

{% block title %} Eliminar Proyecto {% endblock %}

{% block content %}
<main>
    <!-- Muestra el nombre del proyecto que se recibió desde la vista para confirmar -->
    <h1>Estas seguro que quieres eliminar el proyecto "{{ project.name }}"?</h1>
    <!-- Advertencia al usuario sobre la irreversibilidad de la acción -->
    <p>Esta accion no se pude deshacer</p>

    <!-- Formulario que envía una petición POST para ejecutar la eliminación de forma segura -->
    <form method="POST">
        <!-- Token de seguridad obligatorio en Django para evitar ataques CSRF -->
        {% csrf_token %}
        <!-- Botón que dispara el envío del formulario (POST) -->
        <button type="submit" style="background-color: red; color: white">Si eliminar definitivamente</button>
        <!-- Enlace de cancelación que redirige de vuelta a la lista de proyectos -->
        <a href="{% url 'projects' %}">No, volver a la lista de proyectos</a>
    </form>
</main>
{% endblock %}
