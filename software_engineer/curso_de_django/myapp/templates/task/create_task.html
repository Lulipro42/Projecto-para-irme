{% extends "layouts/base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background-color: var(--fondo-header); font-family: sans-serif;">
    
    <h2 style="color: var(--texto-header); margin-bottom: 20px;">🆕 Crear Nueva Tarea</h2>
    
    <form method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; color: var(--texto-header); font-weight: bold; margin-bottom: 5px;">Título:</label>
            <input type="text" name="title" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Descripción:</label>
            <textarea name="description" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; height: 80px;"></textarea>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">📁 Asignar al Proyecto:</label>
            <select name="project_id" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                {% for project in projects %}
                    <option value="{{ project.id }}">{{ project.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">👤 Asignar a Responsable:</label>
            <select name="user_id" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                {% for u in users %}
                    <option value="{{ u.id }}">{{ u.username }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">🎯 Prioridad:</label>
            ...
            <select name="project_id" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                {% for project in projects %}
                    <option value="{{ project.id }}">{{ project.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">🎯 Prioridad:</label>
            <select name="priority" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="Baja">🟢 Baja</option>
                <option value="Media">🟡 Media</option>
                <option value="Alta">🔴 Alta</option>
            </select>
        </div>


        <button type="submit" style="background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">
            Guardar Tarea
        </button>
    </form>
</div>
{% endblock %}
