{% extends "layouts/base.html" %}


{% block content %}
<div "max-width: 500px; margin: 40px auto; padding: 30px; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <h2 style="color: #2c3e50; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #007bff; padding-bottom: 10px;">
        ⚙️ Editar Proyecto
    </h2>
    <form method="POST">
        {% csrf_token %}
        
        <div style"margim-bottom: 15px">
            <label for="name" style="display: block; margin-bottom: 8px; color: #495057; font-weight: 600; font-size: 0.95rem;">
                Nombre del Proyecto
            </label>
            <input type="text" name="name" id="name" value="{{ project.name }}" required style="width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 1rem; box-sizing: border-box;">
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <a href="{% url 'projects' %}" style="background: #6c757d; color: white; text-decoration: none; padding: 10px 15px; border-radius: 6px; font-size: 0.95rem; font-weight: bold;">
                Cancelar
            </a>
            <button type="submit" style="background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer;">
                Guardar Cambios
            </button>
        </div>
    </form>
</div>
{% endblock %}
